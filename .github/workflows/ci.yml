name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Build-time only: the Prisma client is generated, never connected to here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/esper_ci
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-for-validation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx next build

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/esper_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/esper_test
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-for-validation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run integration suite
        run: npm run test:integration

# Deployment is handled by Vercel's own GitHub integration (auto-deploys every push
# to main against the Neon database) — see README -> "Hosting". The previous `deploy`
# job here SSHed into a homeserver for the self-hosted Docker path; that path still
# works (see docker-compose.yml) but isn't the live deployment target anymore, so the
# job was removed rather than left permanently red against an intermittently-off box.
