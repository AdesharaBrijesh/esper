name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Build-time only: the Prisma client is generated, never connected to here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/esper_ci
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-for-validation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx next build

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/esper_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/esper_test
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-for-validation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run integration suite
        run: npm run test:integration

  deploy:
    name: Deploy to homeserver
    runs-on: ubuntu-latest
    needs: [check, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-homeserver
      cancel-in-progress: false
    steps:
      # Puts this ephemeral runner on the private tailnet so it can reach the
      # homeserver at all — it has no public IP and no port is forwarded to it.
      # TS_AUTHKEY: a reusable + ephemeral key from the Tailscale admin console
      # (Settings -> Keys -> Generate auth key). The runner leaves the tailnet
      # on its own once the job ends because it's ephemeral.
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/stdin ~/.ssh/deploy_key <<< "$SSH_KEY"
          # The target is reached only over the tailnet's private IP range; a forced
          # command on the server ignores whatever we pass here and always runs
          # scripts/deploy.sh, so this connection can't do anything else.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -i ~/.ssh/deploy_key -p 2222 \
              brijuice@100.94.112.68 "deploy"
